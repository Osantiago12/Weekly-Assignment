<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="cont.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poller+One&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
</head>

<body>
    <img class="logo" src="/images/logo.jpg" alt="">
    <div class="links">
        <div class="home"><a href="index.htm">HOME</a></div>
        <div class="about"><a href="about.htm">ABOUT</a></div>
        <div class="gallery"><a href="gallery.htm">GALLERY</a></div>
        <div class="blog"><a href="blog.htm">BLOG</a></div>
        <div class="contact" style="color:rgb(40, 180, 170);"><a href="contacts.htm">CONTACT</a></div>
    </div>

    <div class="heading">
        <h1>let's keep in touch</h1>
    </div>

    <form class="textboxes">
        <input type="text" placeholder="NAME">
        <input type="text" placeholder="ADDRESS">

        <input type="tel" placeholder="PHONE NUMBER">
        <textarea placeholder="MESSAGE" rows="8"></textarea>

    <div class="heading">
        <h1 style="font-size: 20px;">Send</h1>
    </div>

    <div class="bar">
        <p>© 2023 by Orlando. All rights reserved.</p>
        <div>
            <img src="/images/icons/icon-twitter.jpg" alt="" class="social">
            <img src="/images/icons/icon-facebook.jpg" alt="" class="social">
            <img src="/images/icons/icon-googleplus.jpg" alt="" class="social">
            <img src="/images/icons/icon-pinterest.jpg" alt="" class="social">
